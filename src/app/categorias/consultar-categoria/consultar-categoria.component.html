<p>DETALLE CATEGORIAS.</p>
<section>
    <button mat-button (click)="enviarFormCategorias()" >Insertar</button>   
</section>
<table mat-table [dataSource]="categorias" class="mat-elevation-z8">
<!-- Position Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> Id Categoria. </th>
    <td mat-cell *matCellDef="let element">{{element.idCategoria}}  </td>
  </ng-container>
   <ng-container matColumnDef="descripcion">
    <th mat-header-cell *matHeaderCellDef> Descripción. </th>
    <td mat-cell *matCellDef="let element">{{element.descripcion}}  </td>
     <td mat-cell *matCellDef="let element">  </td>
  </ng-container>
  <ng-container matColumnDef="esActivo">
    <th mat-header-cell *matHeaderCellDef> Es Activo. </th>
    <td mat-cell *matCellDef="let element">{{element.esActivo}}  </td>
     <td mat-cell *matCellDef="let element">  </td>
  </ng-container>
  <ng-container matColumnDef="fechaRegistro">
    <th mat-header-cell *matHeaderCellDef> Fecha. </th>
    <td mat-cell *matCellDef="let element">{{element.fechaRegistro |date: 'dd/MM/yyyy' }}  </td>
     <td mat-cell *matCellDef="let element">  </td>
  </ng-container>
    <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    
    <td mat-cell *matCellDef="let element">
      <button mat-button color="primary" (click)="editarCategorias(element.idCategoria)">Editar</button>
      <button mat-button color="warn"  (click)="deleteCategoria(element.idCategoria)">Eliminar</button>
    </td>
  </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
