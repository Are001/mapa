<form  (submit)="enviar()"> 
    <div class="form-group">
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <div class="input-group-text">
                    <span class="input-group-addon"><i class="fas fa-user-circle"></i></span>
                </div>
            </div>
            <input type="text" class="form-control" placeholder="Nombre.">
        </div>
    </div>

    <div class="form-group">
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <div class="input-group-text">
                    <span class="input-group-addon"><i class="fa-solid fa-envelope"></i></span>
                </div>
            </div>
            <input type="text" class="form-control" placeholder="Correo.">
        </div>
    </div>
    <div class="form-group">
        <div class="input-group mb-3">
            <div class="input-group-prepend">
                <div class="input-group-text">
                    <span class="input-group-addon"><i class="fa-solid fa-phone"></i></span>
                </div>
            </div>
            <input type="text" class="form-control" placeholder="Telefono.">
        </div>
    </div>
    <div class="form-group">
        <div class="d-grid gap-2">
            <button class="btn btn-success btn-lg btn-block" ><i class="fas fa-database"></i>Aceptar</button>
        </div>
    </div>
</form>
